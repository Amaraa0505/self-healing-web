services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "5050:80"
    depends_on:
      - web
    restart: always
    networks:
      - selfheal_net

  web:
    build: .
    deploy:
      replicas: 3
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 3s
      timeout: 2s
      retries: 2
    restart: always
    networks:
      - selfheal_net

  redis:
    image: redis:alpine
    restart: always
    networks:
      - selfheal_net

networks:
  selfheal_net:
    driver: bridge